<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Demo</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #f0eeff;
    --muted: #8887a0;
    --border: rgba(108, 99, 255, 0.2);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  .header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }

  .header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: .75rem auto 0;
    border-radius: 2px;
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: .05em;
  }

  .header p {
    font-size: .78rem;
    color: var(--muted);
    margin-top: .3rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 1.5rem 1rem;
    max-width: 480px;
    margin: 0 auto;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: transform .15s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
  }

  .btn:active {
    transform: scale(0.97);
    border-color: var(--accent);
  }

  .btn .icon {
    font-size: 2rem;
    flex-shrink: 0;
  }

  .btn .label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    display: block;
  }

  .btn .badge {
    display: inline-block;
    margin-top: .3rem;
    font-size: .65rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(108, 99, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(108, 99, 255, 0.3);
  }

  .btn.audio .badge {
    background: rgba(255, 101, 132, 0.12);
    color: var(--accent2);
    border-color: rgba(255, 101, 132, 0.3);
  }

  .hint {
    text-align: center;
    font-size: .72rem;
    color: var(--muted);
    padding: 0 1rem 2rem;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
  }

  .modal.active {
    display: block;
  }

  #mindar-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .modal-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(1rem, env(safe-area-inset-top)) 1.25rem 1rem;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events: none;
  }

  .modal-bar button {
    pointer-events: all;
  }

  .modal-title {
    font-size: .95rem;
    font-weight: 600;
    color: #fff;
  }

  .close-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  #debug {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(0,0,0,0.75);
    color: #4ade80;
    font-size: 12px;
    font-family: monospace;
    padding: 8px 12px;
    line-height: 1.6;
    pointer-events: none;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
  }

  .scan-overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-box {
    width: 220px;
    height: 220px;
    position: relative;
  }

  .scan-box::before,
  .scan-box::after,
  .scan-box .bl,
  .scan-box .br {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    border-color: var(--accent);
    border-style: solid;
  }

  .scan-box::before {
    top: 0;
    left: 0;
    border-width: 3px 0 0 3px;
    border-radius: 5px 0 0 0;
  }

  .scan-box::after {
    top: 0;
    right: 0;
    border-width: 3px 3px 0 0;
    border-radius: 0 5px 0 0;
  }

  .scan-box .bl {
    bottom: 0;
    left: 0;
    border-width: 0 0 3px 3px;
    border-radius: 0 0 0 5px;
  }

  .scan-box .br {
    bottom: 0;
    right: 0;
    border-width: 0 3px 3px 0;
    border-radius: 0 0 5px 0;
  }

  .scan-line {
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    animation: scanAnim 2s ease-in-out infinite;
    top: 20px;
  }

  @keyframes scanAnim {
    0%, 100% {
      top: 18px;
      opacity: .5;
    }

    50% {
      top: calc(100% - 20px);
      opacity: 1;
    }
  }

  .scan-label {
    margin-top: 1rem;
    font-size: .8rem;
    color: rgba(255,255,255,.8);
    letter-spacing: .05em;
    text-align: center;
  }

  .player-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.93);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 600;
  }

  .player-overlay.active {
    display: flex;
  }

  .player-overlay video {
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    background: #000;
    outline: none;
  }

  .player-overlay audio {
    width: 100%;
    max-width: 480px;
    margin-top: 1rem;
    outline: none;
  }

  .player-label {
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: .75rem;
    text-align: center;
  }

  .manual-play-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
    margin-bottom: 1rem;
  }

  .manual-play-hint {
    font-size: .8rem;
    color: rgba(255,255,255,.75);
    text-align: center;
    line-height: 1.7;
  }

  .play-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: .9rem 1.6rem;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 160px;
    box-shadow: 0 10px 30px rgba(108,99,255,.35);
    -webkit-tap-highlight-color: transparent;
  }

  .play-btn:active {
    transform: scale(.97);
  }

  .rescan-btn {
    margin-top: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: .75rem 1.5rem;
    font-size: .85rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .pulse {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 5px;
    animation: pulseAnim 1.4s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulseAnim {
    0%, 100% {
      opacity: .3;
      transform: scale(.8);
    }

    50% {
      opacity: 1;
      transform: scale(1.2);
    }
  }
</style>
</head>

<body>

<div class="header">
  <h1>AR Scanner</h1>
  <p>Image Recognition Demo</p>
</div>

<div class="grid">

  <button class="btn audio" data-sample="0">
    <span class="icon">🎵</span>
    <div>
      <span class="label">Sample 1</span>
      <span class="badge">Audio</span>
    </div>
  </button>

  <button class="btn" data-sample="1">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 2</span>
      <span class="badge">Video</span>
    </div>
  </button>

  <button class="btn" data-sample="2">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 3</span>
      <span class="badge">Video</span>
    </div>
  </button>

</div>

<p class="hint">
  هر دکمه دوربین را فعال می‌کند.<br>
  تصویر مربوطه را جلوی دوربین بگیرید.
</p>

<div class="modal" id="modal">

  <div id="mindar-container"></div>

  <div class="modal-bar">
    <span class="modal-title" id="modal-title">Sample <span class="pulse"></span></span>
    <button class="close-btn" id="closeBtn" type="button">✕</button>
  </div>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-box">
      <div class="bl"></div>
      <div class="br"></div>
      <div class="scan-line"></div>
    </div>

    <div class="scan-label" id="scanLabel">در حال بارگذاری...</div>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-label" id="playerLabel"></div>

    <div class="manual-play-box" id="manualPlayBox">
      <button class="play-btn" id="playBtn" type="button">▶ پخش</button>
      <div class="manual-play-hint">
        تصویر شناسایی شد.<br>
        برای پخش فایل، روی دکمه پخش بزنید.
      </div>
    </div>

    <video id="mediaVideo" controls playsinline webkit-playsinline preload="metadata" style="display:none"></video>
    <audio id="mediaAudio" controls preload="metadata" style="display:none"></audio>

    <button class="rescan-btn" id="rescanBtn" type="button">🔄 اسکن مجدد</button>
  </div>

  <div id="debug">در حال آماده‌سازی...</div>

</div>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap-shim">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module-shim">
import { MindARThree } from "mindar-image-three";

const SAMPLES = [
  {
    label: "Sample 1 — Audio",
    type: "audio",
    mindFile: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A01.mind",
    mediaUrl: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A01.mp3"
  },
  {
    label: "Sample 2 — Video",
    type: "video",
    mindFile: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A02.mind",
    mediaUrl: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A02.mp4"
  },
  {
    label: "Sample 3 — Video",
    type: "video",
    mindFile: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A03.mind",
    mediaUrl: "https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A03.mp4"
  }
];

let mindarInstance = null;
let currentSample = null;
let isStarting = false;
let mediaPrepared = false;

function log(message) {
  const debugBox = document.getElementById("debug");

  if (debugBox) {
    debugBox.textContent = message;
  }

  console.log(message);
}

function resetMedia() {
  const video = document.getElementById("mediaVideo");
  const audio = document.getElementById("mediaAudio");
  const manualPlayBox = document.getElementById("manualPlayBox");

  mediaPrepared = false;

  if (video) {
    video.pause();
    video.removeAttribute("src");
    video.load();
    video.style.display = "none";
  }

  if (audio) {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    audio.style.display = "none";
  }

  if (manualPlayBox) {
    manualPlayBox.style.display = "flex";
  }
}

async function stopARInstance() {
  if (!mindarInstance) return;

  try {
    if (mindarInstance.renderer) {
      mindarInstance.renderer.setAnimationLoop(null);
    }
  } catch (error) {
    console.warn("Renderer stop warning:", error);
  }

  try {
    await mindarInstance.stop();
  } catch (error) {
    console.warn("MindAR stop warning:", error);
  }

  mindarInstance = null;
}

async function startAR(index) {
  if (isStarting) return;

  isStarting = true;
  currentSample = SAMPLES[index];

  const modal = document.getElementById("modal");
  const mindarContainer = document.getElementById("mindar-container");
  const scanOverlay = document.getElementById("scanOverlay");
  const scanLabel = document.getElementById("scanLabel");
  const playerOverlay = document.getElementById("playerOverlay");
  const modalTitle = document.getElementById("modal-title");

  modal.classList.add("active");
  modalTitle.innerHTML = `Sample ${index + 1} <span class="pulse"></span>`;

  scanOverlay.style.display = "flex";
  scanLabel.textContent = "در حال بارگذاری...";
  playerOverlay.classList.remove("active");

  resetMedia();

  mindarContainer.innerHTML = "";

  try {
    log("Stopping previous AR instance...");
    await stopARInstance();

    log("Loading target file:\n" + currentSample.mindFile);

    mindarInstance = new MindARThree({
      container: mindarContainer,
      imageTargetSrc: currentSample.mindFile,
      maxTrack: 1,
      uiLoading: "no",
      uiScanning: "no",
      uiError: "no",
      filterMinCF: 0.001,
      filterBeta: 0.01,
      missTolerance: 5,
      warmupTolerance: 3
    });

    const { renderer, scene, camera } = mindarInstance;

    const anchor = mindarInstance.addAnchor(0);

    anchor.onTargetFound = () => {
      log("✅ Target found. Media is ready for manual play.");
      prepareMedia();
    };

    anchor.onTargetLost = () => {
      log("Target lost");
    };

    log("Starting camera...");

    await mindarInstance.start();

    log("✅ Camera is active. Show the target image.");
    scanLabel.textContent = "تصویر را جلوی دوربین بگیرید";

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);

    const errorMessage = error && error.message ? error.message : String(error);

    log("❌ Error:\n" + errorMessage);
    scanLabel.textContent = "خطا در راه‌اندازی AR";
  } finally {
    isStarting = false;
  }
}

function prepareMedia() {
  if (mediaPrepared) return;

  mediaPrepared = true;

  const scanOverlay = document.getElementById("scanOverlay");
  const playerOverlay = document.getElementById("playerOverlay");
  const playerLabel = document.getElementById("playerLabel");
  const video = document.getElementById("mediaVideo");
  const audio = document.getElementById("mediaAudio");
  const manualPlayBox = document.getElementById("manualPlayBox");

  scanOverlay.style.display = "none";
  playerOverlay.classList.add("active");
  playerLabel.textContent = currentSample.label;

  manualPlayBox.style.display = "flex";

  if (currentSample.type === "video") {
    audio.pause();
    audio.style.display = "none";

    video.src = currentSample.mediaUrl;
    video.style.display = "block";
    video.load();

    video.onerror = () => {
      log("❌ Video load error. Google Drive direct links may not support browser streaming.");
    };

  } else {
    video.pause();
    video.style.display = "none";

    audio.src = currentSample.mediaUrl;
    audio.style.display = "block";
    audio.load();

    audio.onerror = () => {
      log("❌ Audio load error. Google Drive direct links may not support browser streaming.");
    };
  }
}

async function playSelectedMedia() {
  const video = document.getElementById("mediaVideo");
  const audio = document.getElementById("mediaAudio");
  const manualPlayBox = document.getElementById("manualPlayBox");

  if (!currentSample) {
    log("No sample selected.");
    return;
  }

  try {
    if (currentSample.type === "video") {
      await video.play();
      manualPlayBox.style.display = "none";
      log("▶ Video playing");
    } else {
      await audio.play();
      manualPlayBox.style.display = "none";
      log("▶ Audio playing");
    }
  } catch (error) {
    console.error(error);

    const errorMessage = error && error.message ? error.message : String(error);

    log(
      "❌ Play error:\n" +
      errorMessage +
      "\n\nIf this continues, move the media files from Google Drive to a direct hosting service."
    );
  }
}

function rescan() {
  const playerOverlay = document.getElementById("playerOverlay");
  const scanOverlay = document.getElementById("scanOverlay");
  const scanLabel = document.getElementById("scanLabel");

  resetMedia();

  playerOverlay.classList.remove("active");
  scanOverlay.style.display = "flex";
  scanLabel.textContent = "تصویر را جلوی دوربین بگیرید";

  log("✅ Camera is active. Show the target image.");
}

async function closeAR() {
  await stopARInstance();

  resetMedia();

  document.getElementById("modal").classList.remove("active");
  document.getElementById("playerOverlay").classList.remove("active");
  document.getElementById("scanOverlay").style.display = "flex";
  document.getElementById("mindar-container").innerHTML = "";

  log("AR closed");
}

function bindButtons() {
  const sampleButtons = document.querySelectorAll("[data-sample]");
  const closeBtn = document.getElementById("closeBtn");
  const rescanBtn = document.getElementById("rescanBtn");
  const playBtn = document.getElementById("playBtn");

  sampleButtons.forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.sample);
      startAR(index);
    });
  });

  if (closeBtn) {
    closeBtn.addEventListener("click", closeAR);
  }

  if (rescanBtn) {
    rescanBtn.addEventListener("click", rescan);
  }

  if (playBtn) {
    playBtn.addEventListener("click", playSelectedMedia);
  }

  log("✅ App loaded. Buttons are ready.");
}

bindButtons();

window.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAR();
  }
});
</script>

</body>
</html>

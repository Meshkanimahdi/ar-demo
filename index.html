
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Demo Final Clean</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #000;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #ffffff;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #mindar-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
  }

  .top-status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2147483000;
    padding: max(1rem, env(safe-area-inset-top)) 1rem 1rem;
    text-align: center;
    color: #fff;
    font-size: .88rem;
    font-weight: 600;
    background: linear-gradient(to bottom, rgba(0,0,0,.72), transparent);
    pointer-events: none;
  }

  .pulse {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 6px;
    animation: pulseAnim 1.3s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulseAnim {
    0%, 100% {
      opacity: .35;
      transform: scale(.75);
    }

    50% {
      opacity: 1;
      transform: scale(1.25);
    }
  }

  .scan-overlay {
    position: fixed;
    inset: 0;
    z-index: 2147482500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-box {
    width: 230px;
    height: 230px;
    position: relative;
  }

  .scan-box::before,
  .scan-box::after,
  .scan-box .bl,
  .scan-box .br {
    content: "";
    position: absolute;
    width: 34px;
    height: 34px;
    border-color: var(--accent);
    border-style: solid;
  }

  .scan-box::before {
    top: 0;
    left: 0;
    border-width: 3px 0 0 3px;
    border-radius: 6px 0 0 0;
  }

  .scan-box::after {
    top: 0;
    right: 0;
    border-width: 3px 3px 0 0;
    border-radius: 0 6px 0 0;
  }

  .scan-box .bl {
    bottom: 0;
    left: 0;
    border-width: 0 0 3px 3px;
    border-radius: 0 0 0 6px;
  }

  .scan-box .br {
    bottom: 0;
    right: 0;
    border-width: 0 3px 3px 0;
    border-radius: 0 0 6px 0;
  }

  .scan-line {
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    top: 20px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    animation: scanAnim 2s ease-in-out infinite;
  }

  @keyframes scanAnim {
    0%, 100% {
      top: 18px;
      opacity: .45;
    }

    50% {
      top: calc(100% - 20px);
      opacity: 1;
    }
  }

  .scan-label {
    margin-top: 1rem;
    color: rgba(255,255,255,.86);
    font-size: .82rem;
    text-align: center;
    line-height: 1.8;
    padding: 0 1rem;
  }

  .sound-control {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 96px);
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex !important;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  .sound-control button {
    background: linear-gradient(135deg, rgba(108,99,255,.98), rgba(255,101,132,.98));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: .95rem 1.45rem;
    font-size: .95rem;
    font-weight: 800;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 44px rgba(0,0,0,.58);
    -webkit-tap-highlight-color: transparent;
  }

  .sound-control button:active {
    transform: scale(.96);
  }

  .audio-unlock {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 2147483647;
    transform: translate(-50%, -50%);
    display: none;
    width: min(86vw, 360px);
    padding: 1.2rem;
    border-radius: 24px;
    border: 1px solid rgba(108,99,255,.35);
    background: rgba(10,10,15,.92);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
  }

  .audio-unlock.active {
    display: block;
  }

  .audio-unlock p {
    color: rgba(255,255,255,.84);
    font-size: .9rem;
    line-height: 1.8;
    margin-bottom: .9rem;
  }

  .audio-unlock button {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: .9rem 1.5rem;
    font-size: .96rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 180px;
    -webkit-tap-highlight-color: transparent;
  }

  .audio-unlock button:active {
    transform: scale(.97);
  }

  #debug {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2147482000;
    padding: 8px 12px;
    background: rgba(0,0,0,.72);
    color: #4ade80;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    line-height: 1.55;
    white-space: pre-wrap;
    direction: ltr;
    text-align: left;
    pointer-events: none;
  }
</style>
</head>

<body>

<div id="app">

  <div id="mindar-container"></div>

  <div class="top-status" id="topStatus">
    AR Scanner <span class="pulse"></span>
  </div>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-box">
      <div class="bl"></div>
      <div class="br"></div>
      <div class="scan-line"></div>
    </div>

    <div class="scan-label" id="scanLabel">
      در حال راه‌اندازی دوربین...<br>
      هرکدام از سه تصویر را جلوی دوربین بگیرید.
    </div>
  </div>

  <div class="sound-control" id="soundControl">
    <button id="soundBtn" type="button">🔊 صدای ویدیو</button>
  </div>

  <div class="audio-unlock" id="audioUnlock">
    <p>
      برای پخش صدا در موبایل، یک بار باید اجازه پخش صوت فعال شود.
    </p>
    <button id="audioUnlockBtn" type="button">فعال‌سازی صدا</button>
  </div>

  <div id="debug">در حال آماده‌سازی...</div>

</div>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap-shim">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module-shim">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const MULTI_TARGET_MIND_FILE = "./targets.mind";

const SAMPLES = [
  {
    label: "Audio Experience",
    type: "audio",
    targetIndex: 0,
    targetImage: "./a01.webp",
    mediaUrl: "./A01.mp3"
  },
  {
    label: "Video Experience 1",
    type: "video",
    targetIndex: 1,
    targetImage: "./a02.jpg",
    mediaUrl: "./A02.mp4"
  },
  {
    label: "Video Experience 2",
    type: "video",
    targetIndex: 2,
    targetImage: "./a03.jpg",
    mediaUrl: "./A03.mp4"
  }
];

let mindarInstance = null;
let currentActiveIndex = null;
let isStarting = false;
let videoSoundEnabled = false;

const anchors = [];
const arMeshes = [];
const textures = [];
const mediaElements = [];
const targetAspects = [];

function log(message) {
  const debugBox = document.getElementById("debug");

  if (debugBox) {
    debugBox.textContent = message;
  }

  console.log(message);
}

function setStatus(message) {
  const topStatus = document.getElementById("topStatus");

  if (topStatus) {
    topStatus.innerHTML = message + ' <span class="pulse"></span>';
  }
}

function showScanOverlay(message = null) {
  const scanOverlay = document.getElementById("scanOverlay");
  const scanLabel = document.getElementById("scanLabel");

  if (scanOverlay) {
    scanOverlay.style.display = "flex";
  }

  if (message && scanLabel) {
    scanLabel.innerHTML = message;
  }
}

function hideScanOverlay() {
  const scanOverlay = document.getElementById("scanOverlay");

  if (scanOverlay) {
    scanOverlay.style.display = "none";
  }
}

function showAudioUnlock() {
  const box = document.getElementById("audioUnlock");
  if (box) box.classList.add("active");
}

function hideAudioUnlock() {
  const box = document.getElementById("audioUnlock");
  if (box) box.classList.remove("active");
}

function loadImageAspect(src) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => {
      const width = img.naturalWidth || img.width;
      const height = img.naturalHeight || img.height;

      if (!width || !height) {
        resolve(16 / 9);
        return;
      }

      resolve(width / height);
    };

    img.onerror = () => {
      resolve(16 / 9);
    };

    img.src = src;
  });
}

function applyCoverUV(texture, mediaAspect, targetAspect) {
  texture.offset.set(0, 0);
  texture.repeat.set(1, 1);

  if (!mediaAspect || !targetAspect) return;

  if (mediaAspect > targetAspect) {
    const repeatX = targetAspect / mediaAspect;
    texture.repeat.set(repeatX, 1);
    texture.offset.set((1 - repeatX) / 2, 0);
  } else if (mediaAspect < targetAspect) {
    const repeatY = mediaAspect / targetAspect;
    texture.repeat.set(1, repeatY);
    texture.offset.set(0, (1 - repeatY) / 2);
  }
}

function stopAllMediaExcept(indexToKeep = null) {
  mediaElements.forEach((media, index) => {
    if (!media) return;
    if (index === indexToKeep) return;

    try {
      media.pause();
    } catch (error) {}
  });
}

function clearARContent() {
  anchors.forEach((anchor, index) => {
    const mesh = arMeshes[index];

    if (anchor && mesh) {
      try {
        anchor.group.remove(mesh);
      } catch (error) {}
    }
  });

  textures.forEach(texture => {
    if (!texture) return;

    try {
      texture.dispose();
    } catch (error) {}
  });

  arMeshes.forEach(mesh => {
    if (!mesh) return;

    try {
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
    } catch (error) {}
  });

  mediaElements.forEach(media => {
    if (!media) return;

    try {
      media.pause();
      media.removeAttribute("src");
      media.load();
    } catch (error) {}
  });

  anchors.length = 0;
  arMeshes.length = 0;
  textures.length = 0;
  mediaElements.length = 0;
  targetAspects.length = 0;

  currentActiveIndex = null;
  hideAudioUnlock();
}

async function stopARInstance() {
  clearARContent();

  if (!mindarInstance) return;

  try {
    if (mindarInstance.renderer) {
      mindarInstance.renderer.setAnimationLoop(null);
    }
  } catch (error) {}

  try {
    await mindarInstance.stop();
  } catch (error) {}

  mindarInstance = null;
}

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function createAudioCardTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 640;

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, "#6c63ff");
  gradient.addColorStop(1, "#ff6584");

  ctx.fillStyle = "rgba(10,10,15,0.88)";
  roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 48);
  ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 5;
  roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 48);
  ctx.stroke();

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 210, 86, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 92px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("♪", canvas.width / 2, 210);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 54px Arial";
  ctx.fillText("Audio Experience", canvas.width / 2, 380);

  ctx.fillStyle = "rgba(255,255,255,0.72)";
  ctx.font = "34px Arial";
  ctx.fillText("Sound attached to this image", canvas.width / 2, 445);

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;

  return texture;
}

function createAudioElement(src) {
  const audio = document.createElement("audio");

  audio.src = src;
  audio.loop = true;
  audio.preload = "auto";

  return audio;
}

function createVideoElement(src) {
  const video = document.createElement("video");

  video.src = src;
  video.crossOrigin = "anonymous";
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.preload = "auto";

  return video;
}

function createAudioARMesh(sampleIndex) {
  const sample = SAMPLES[sampleIndex];
  const aspect = targetAspects[sampleIndex] || 16 / 9;

  const texture = createAudioCardTexture();
  textures[sampleIndex] = texture;

  const targetWidth = 1;
  const targetHeight = 1 / aspect;

  const geometry = new THREE.PlaneGeometry(targetWidth, targetHeight);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide,
    depthTest: true,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0, 0.02);

  arMeshes[sampleIndex] = mesh;

  const audio = createAudioElement(sample.mediaUrl);
  audio.addEventListener("error", () => {
    log("❌ Audio error for target " + sample.targetIndex);
  });

  mediaElements[sampleIndex] = audio;
  audio.load();

  return mesh;
}

function createVideoARMesh(sampleIndex, videoElement) {
  const sample = SAMPLES[sampleIndex];
  const targetAspect = targetAspects[sampleIndex] || 16 / 9;

  const texture = new THREE.VideoTexture(videoElement);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;

  const videoWidth = videoElement.videoWidth || 1920;
  const videoHeight = videoElement.videoHeight || 1080;
  const videoAspect = videoWidth / videoHeight;

  applyCoverUV(texture, videoAspect, targetAspect);

  textures[sampleIndex] = texture;

  const targetWidth = 1;
  const targetHeight = 1 / targetAspect;

  const geometry = new THREE.PlaneGeometry(targetWidth, targetHeight);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: false,
    side: THREE.DoubleSide,
    depthTest: true,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0, 0.02);

  arMeshes[sampleIndex] = mesh;

  log(
    "✅ Video mesh ready for target " + sample.targetIndex + "\n" +
    "target aspect: " + targetAspect.toFixed(4) + "\n" +
    "video aspect: " + videoAspect.toFixed(4)
  );

  return mesh;
}

async function prepareAllTargets() {
  log("Reading target image sizes...");

  for (let i = 0; i < SAMPLES.length; i++) {
    targetAspects[i] = await loadImageAspect(SAMPLES[i].targetImage);
  }

  log(
    "Target aspects ready:\n" +
    targetAspects.map((aspect, index) => "Target " + index + ": " + aspect.toFixed(4)).join("\n")
  );
}

function setupAnchors() {
  SAMPLES.forEach((sample, sampleIndex) => {
    const anchor = mindarInstance.addAnchor(sample.targetIndex);
    anchors[sampleIndex] = anchor;

    if (sample.type === "audio") {
      const mesh = createAudioARMesh(sampleIndex);
      anchor.group.add(mesh);
    }

    if (sample.type === "video") {
      const video = createVideoElement(sample.mediaUrl);
      mediaElements[sampleIndex] = video;

      video.addEventListener("loadedmetadata", () => {
        if (arMeshes[sampleIndex]) return;

        const mesh = createVideoARMesh(sampleIndex, video);
        anchor.group.add(mesh);

        log("✅ Video attached to target " + sample.targetIndex);
      });

      video.addEventListener("error", () => {
        log("❌ Video error for target " + sample.targetIndex + ". Check H.264 + AAC.");
      });

      video.load();
    }

    anchor.onTargetFound = async () => {
      currentActiveIndex = sampleIndex;

      hideScanOverlay();
      hideAudioUnlock();

      setStatus(sample.label);
      stopAllMediaExcept(sampleIndex);

      const media = mediaElements[sampleIndex];

      log("✅ Target " + sample.targetIndex + " found: " + sample.label);

      if (!media) {
        log("Media not ready yet.");
        return;
      }

      try {
        if (sample.type === "video") {
          media.muted = !videoSoundEnabled;
          media.volume = 1;

          await media.play();

          log("▶ Video AR playing for target " + sample.targetIndex + ". Sound button is always visible.");
        } else {
          await media.play();

          log("▶ Audio playing for target " + sample.targetIndex);
        }
      } catch (error) {
        if (sample.type === "audio") {
          showAudioUnlock();
          log("⚠️ Audio autoplay blocked. Unlock required.");
        } else {
          log("⚠️ Video play issue. Tap sound/video button if needed.");
        }
      }
    };

    anchor.onTargetLost = () => {
      const media = mediaElements[sampleIndex];

      if (media) {
        try {
          media.pause();
        } catch (error) {}
      }

      if (currentActiveIndex === sampleIndex) {
        currentActiveIndex = null;
      }

      hideAudioUnlock();

      setStatus("AR Scanner");
      showScanOverlay(".");

      log("Target " + sample.targetIndex + " lost.");
    };
  });
}

async function startAR() {
  if (isStarting) return;

  isStarting = true;

  try {
    hideAudioUnlock();

    await stopARInstance();

    showScanOverlay("در حال آماده‌سازی AR...<br>لطفاً چند لحظه صبر کنید.");

    await prepareAllTargets();

    log("Loading multi-target file:\n" + MULTI_TARGET_MIND_FILE);

    mindarInstance = new MindARThree({
      container: document.getElementById("mindar-container"),
      imageTargetSrc: MULTI_TARGET_MIND_FILE,
      maxTrack: 1,
      uiLoading: "no",
      uiScanning: "no",
      uiError: "no",
      filterMinCF: 0.001,
      filterBeta: 0.01,
      missTolerance: 5,
      warmupTolerance: 3
    });

    const { renderer, scene, camera } = mindarInstance;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    setupAnchors();

    log("Starting camera...");

    showScanOverlay("در حال درخواست دسترسی دوربین...");

    await mindarInstance.start();

    showScanOverlay(".");

    log("✅ Camera is active. Show any of the 3 target images.");

    renderer.setAnimationLoop(() => {
      const audioMesh = arMeshes[0];

      if (audioMesh && currentActiveIndex === 0) {
        audioMesh.rotation.z = Math.sin(Date.now() * 0.002) * 0.035;
        const scale = 1 + Math.sin(Date.now() * 0.004) * 0.025;
        audioMesh.scale.set(scale, scale, scale);
      }

      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);

    const errorMessage = error && error.message ? error.message : String(error);

    showScanOverlay("خطا در راه‌اندازی دوربین یا AR.<br>لطفاً دسترسی دوربین را بررسی کنید.");
    log("❌ Camera / AR start error:\n" + errorMessage);
  } finally {
    isStarting = false;
  }
}

async function enableSound() {
  const button = document.getElementById("soundBtn");

  if (button) {
    button.textContent = "🔊 در حال فعال‌سازی...";
  }

  if (currentActiveIndex === null) {
    log("No active target yet. Point the camera at a video target, then tap the sound button.");

    if (button) {
      button.textContent = "🔊 صدای ویدیو";
    }

    return;
  }

  const sample = SAMPLES[currentActiveIndex];
  const media = mediaElements[currentActiveIndex];

  if (!sample || !media) {
    log("No media ready yet.");

    if (button) {
      button.textContent = "🔊 صدای ویدیو";
    }

    return;
  }

  if (sample.type !== "video") {
    log("Active target is not a video target.");

    if (button) {
      button.textContent = "🔊 صدای ویدیو";
    }

    return;
  }

  try {
    videoSoundEnabled = true;

    media.muted = false;
    media.volume = 1;

    await media.play();

    if (button) {
      button.textContent = "✅ صدا فعال شد";
    }

    log("🔊 Video sound enabled for target " + sample.targetIndex);

    setTimeout(() => {
      if (button) {
        button.textContent = "🔊 صدای ویدیو";
      }
    }, 1800);

  } catch (error) {
    const errorMessage = error && error.message ? error.message : String(error);

    if (button) {
      button.textContent = "🔊 دوباره بزنید";
    }

    log("❌ Sound play error:\n" + errorMessage);
  }
}

async function enableAudioUnlock() {
  hideAudioUnlock();

  if (currentActiveIndex === null) {
    log("No active target yet.");
    return;
  }

  const sample = SAMPLES[currentActiveIndex];
  const media = mediaElements[currentActiveIndex];

  if (!sample || !media) {
    log("No audio media ready.");
    return;
  }

  try {
    await media.play();
    log("🔊 Audio enabled for target " + sample.targetIndex);
  } catch (error) {
    const errorMessage = error && error.message ? error.message : String(error);
    log("❌ Audio unlock error:\n" + errorMessage);
  }
}

function bindEvents() {
  const audioUnlockBtn = document.getElementById("audioUnlockBtn");
  const soundBtn = document.getElementById("soundBtn");

  if (audioUnlockBtn) {
    audioUnlockBtn.addEventListener("click", enableAudioUnlock);
  }

  if (soundBtn) {
    soundBtn.addEventListener("click", enableSound);
  }

  log("✅ App loaded. Auto-starting AR now...");
}

bindEvents();

setTimeout(() => {
  startAR();
}, 300);
</script>

</body>

<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#13131a; --accent:#6c63ff;
    --accent2:#ff6584; --text:#f0eeff; --muted:#8887a0;
    --border:rgba(108,99,255,0.2);
  }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }

  .header { text-align:center; padding:2rem 1rem 1rem; }
  .header::after { content:''; display:block; width:60px; height:2px; background:var(--accent); margin:.75rem auto 0; border-radius:2px; }
  .header h1 { font-size:1.4rem; font-weight:700; letter-spacing:.05em; }
  .header p { font-size:.78rem; color:var(--muted); margin-top:.3rem; letter-spacing:.08em; text-transform:uppercase; }

  .grid { display:flex; flex-direction:column; gap:12px; padding:1.5rem 1rem; max-width:480px; margin:0 auto; }

  .btn {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:1.2rem 1.5rem; cursor:pointer; display:flex; align-items:center; gap:1rem;
    transition:transform .15s,border-color .2s; -webkit-tap-highlight-color:transparent; width:100%;
  }
  .btn:active { transform:scale(0.97); border-color:var(--accent); }
  .btn .icon { font-size:2rem; flex-shrink:0; }
  .btn .label { font-size:1rem; font-weight:600; color:var(--text); display:block; }
  .btn .badge {
    display:inline-block; margin-top:.3rem; font-size:.65rem; letter-spacing:.1em;
    text-transform:uppercase; padding:2px 8px; border-radius:20px;
    background:rgba(108,99,255,0.15); color:var(--accent); border:1px solid rgba(108,99,255,0.3);
  }
  .btn.audio .badge { background:rgba(255,101,132,0.12); color:var(--accent2); border-color:rgba(255,101,132,0.3); }

  .hint { text-align:center; font-size:.72rem; color:var(--muted); padding:0 1rem 2rem; max-width:480px; margin:0 auto; line-height:1.7; }

  /* Modal */
  .modal { display:none; position:fixed; inset:0; background:#000; z-index:200; }
  .modal.active { display:block; }

  /* MindAR container — باید پر باشه */
  #mindar-container {
    position:absolute; inset:0; width:100%; height:100%;
  }

  .modal-bar {
    position:absolute; top:0; left:0; right:0; z-index:999;
    display:flex; align-items:center; justify-content:space-between;
    padding:max(1rem,env(safe-area-inset-top)) 1.25rem 1rem;
    background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);
    pointer-events:none;
  }
  .modal-bar button { pointer-events:all; }
  .modal-title { font-size:.95rem; font-weight:600; color:#fff; }
  .close-btn {
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.2);
    color:#fff; border-radius:50%; width:40px; height:40px; font-size:1.2rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }

  /* Debug panel */
  #debug {
    position:absolute; bottom:0; left:0; right:0; z-index:999;
    background:rgba(0,0,0,0.75); color:#4ade80;
    font-size:12px; font-family:monospace;
    padding:8px 12px; line-height:1.6;
    pointer-events:none;
  }

  /* Scan frame روی دوربین */
  .scan-overlay {
    position:absolute; inset:0; z-index:500;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .scan-box { width:220px; height:220px; position:relative; }
  .scan-box::before,.scan-box::after,.scan-box .bl,.scan-box .br {
    content:''; position:absolute; width:32px; height:32px;
    border-color:var(--accent); border-style:solid;
  }
  .scan-box::before { top:0;left:0;border-width:3px 0 0 3px;border-radius:5px 0 0 0; }
  .scan-box::after  { top:0;right:0;border-width:3px 3px 0 0;border-radius:0 5px 0 0; }
  .scan-box .bl { bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 5px; }
  .scan-box .br { bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 5px 0; }
  .scan-line {
    position:absolute; left:8px; right:8px; height:2px;
    background:linear-gradient(to right,transparent,var(--accent),transparent);
    animation:scanAnim 2s ease-in-out infinite; top:20px;
  }
  @keyframes scanAnim { 0%,100%{top:18px;opacity:.5} 50%{top:calc(100% - 20px);opacity:1} }
  .scan-label { margin-top:1rem; font-size:.8rem; color:rgba(255,255,255,.8); letter-spacing:.05em; text-align:center; }

  /* Media player */
  .player-overlay {
    display:none; position:absolute; inset:0; background:rgba(0,0,0,.93);
    flex-direction:column; align-items:center; justify-content:center;
    padding:1.5rem; z-index:600;
  }
  .player-overlay.active { display:flex; }
  .player-overlay video { width:100%; max-width:480px; border-radius:12px; background:#000; outline:none; }
  .player-overlay audio { width:100%; max-width:480px; margin-top:1rem; outline:none; }
  .player-label { font-size:.85rem; color:var(--muted); margin-bottom:.75rem; }
  .rescan-btn {
    margin-top:1.25rem; background:var(--surface); border:1px solid var(--border);
    color:var(--text); border-radius:12px; padding:.75rem 1.5rem;
    font-size:.85rem; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }

  .pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-left:5px; animation:p 1.4s ease-in-out infinite; vertical-align:middle; }
  @keyframes p { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }
</style>
</head>
<body>

<div class="header">
  <h1>AR Scanner</h1>
  <p>Image Recognition Demo</p>
</div>

<div class="grid">
  <button class="btn audio" onclick="startAR(0)">
    <span class="icon">🎵</span>
    <div>
      <span class="label">Sample 1</span>
      <span class="badge">Audio</span>
    </div>
  </button>
  <button class="btn" onclick="startAR(1)">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 2</span>
      <span class="badge">Video</span>
    </div>
  </button>
  <button class="btn" onclick="startAR(2)">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 3</span>
      <span class="badge">Video</span>
    </div>
  </button>
</div>

<p class="hint">هر دکمه دوربین را فعال می‌کند.<br>تصویر مربوطه را جلوی دوربین بگیرید.</p>

<!-- AR Modal -->
<div class="modal" id="modal">

  <!-- MindAR اینجا render میکنه -->
  <div id="mindar-container"></div>

  <div class="modal-bar">
    <span class="modal-title" id="modal-title">Sample <span class="pulse"></span></span>
    <button class="close-btn" onclick="closeAR()">✕</button>
  </div>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-box">
      <div class="bl"></div><div class="br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-label" id="scanLabel">در حال بارگذاری...</div>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-label" id="playerLabel"></div>
    <video id="mediaVideo" controls playsinline style="display:none"></video>
    <audio id="mediaAudio" controls style="display:none"></audio>
    <button class="rescan-btn" onclick="rescan()">🔄 اسکن مجدد</button>
  </div>

  <div id="debug">در حال آماده‌سازی...</div>
</div>

<!-- THREE.js اول -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<!-- بعد MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

<script>
const SAMPLES = [
  {
    label: 'Sample 1 — Audio',
    type: 'audio',
    mindFile: 'https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A01',
    mediaUrl: 'https://drive.google.com/uc?export=download&id=1SW8ORQRZj-kY5dCpCI4p-Td7ZkLX1qZS'
  },
  {
    label: 'Sample 2 — Video',
    type: 'video',
    mindFile: 'https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A02',
    mediaUrl: 'https://drive.google.com/uc?export=download&id=1xNzvWmXGkkqLtUWrrutCSWIsrnaWc32q'
  },
  {
    label: 'Sample 3 — Video',
    type: 'video',
    mindFile: 'https://raw.githubusercontent.com/Meshkanimahdi/ar-demo/main/A03',
    mediaUrl: 'https://drive.google.com/uc?export=download&id=1QkccEkQwgQ3NKK6QLHcHuLgMMMI0NFd9'
  }
];

let mindarInstance = null;
let currentSample = null;
let animLoop = null;

function log(msg) {
  const d = document.getElementById('debug');
  if (d) d.textContent = msg;
  console.log(msg);
}

async function startAR(index) {
  currentSample = SAMPLES[index];

  document.getElementById('modal').classList.add('active');
  document.getElementById('modal-title').innerHTML = `Sample ${index + 1} <span class="pulse"></span>`;
  document.getElementById('scanOverlay').style.display = 'flex';
  document.getElementById('scanLabel').textContent = 'در حال بارگذاری...';
  document.getElementById('playerOverlay').classList.remove('active');
  document.getElementById('mediaVideo').style.display = 'none';
  document.getElementById('mediaAudio').style.display = 'none';
  document.getElementById('mediaVideo').src = '';
  document.getElementById('mediaAudio').src = '';
  document.getElementById('mindar-container').innerHTML = '';

  log('در حال بارگذاری کتابخانه AR...');

  try {
    if (mindarInstance) {
      try { await mindarInstance.stop(); } catch(e) {}
      mindarInstance = null;
    }
    if (animLoop) { cancelAnimationFrame(animLoop); animLoop = null; }

    log('در حال خواندن فایل target: ' + currentSample.mindFile);

    const MindARThree = window.MINDAR.IMAGE.MindARThree || window.MindARThree;

    mindarInstance = new MindARThree({
      container: document.getElementById('mindar-container'),
      imageTargetSrc: currentSample.mindFile,
      maxTrack: 1,
      uiLoading: 'no',
      uiScanning: 'no',
      uiError: 'no',
      filterMinCF: 0.001,
      filterBeta: 0.01,
      missTolerance: 5,
      warmupTolerance: 3
    });

    const { renderer, scene, camera } = mindarInstance;

    const anchor = mindarInstance.addAnchor(0);

    anchor.onTargetFound = () => {
      log('✅ تصویر شناسایی شد!');
      showMedia();
    };

    anchor.onTargetLost = () => {
      log('تصویر از دید خارج شد');
    };

    log('در حال راه‌اندازی دوربین...');
    await mindarInstance.start();
    log('✅ دوربین فعال — تصویر را نشان دهید');
    document.getElementById('scanLabel').textContent = 'تصویر را جلوی دوربین بگیرید';

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

  } catch (err) {
    log('❌ خطا: ' + err.message);
    console.error(err);
  }
}

function showMedia() {
  document.getElementById('scanOverlay').style.display = 'none';
  document.getElementById('playerOverlay').classList.add('active');
  document.getElementById('playerLabel').textContent = currentSample.label;

  if (currentSample.type === 'video') {
    const v = document.getElementById('mediaVideo');
    v.src = currentSample.mediaUrl;
    v.style.display = 'block';
    v.load();
    v.play().catch(e => log('video play error: ' + e.message));
  } else {
    const a = document.getElementById('mediaAudio');
    a.src = currentSample.mediaUrl;
    a.style.display = 'block';
    a.load();
    a.play().catch(e => log('audio play error: ' + e.message));
  }
}

function rescan() {
  document.getElementById('playerOverlay').classList.remove('active');
  document.getElementById('mediaVideo').pause();
  document.getElementById('mediaAudio').pause();
  document.getElementById('scanOverlay').style.display = 'flex';
  document.getElementById('scanLabel').textContent = 'تصویر را جلوی دوربین بگیرید';
  log('✅ دوربین فعال — تصویر را نشان دهید');
}

async function closeAR() {
  if (mindarInstance) {
    try { await mindarInstance.stop(); } catch(e) {}
    mindarInstance = null;
  }
  if (animLoop) { cancelAnimationFrame(animLoop); animLoop = null; }
  document.getElementById('mediaVideo').pause();
  document.getElementById('mediaAudio').pause();
  document.getElementById('modal').classList.remove('active');
  document.getElementById('mindar-container').innerHTML = '';
}

window.addEventListener('keydown', e => { if (e.key === 'Escape') closeAR(); });
</script>
</body>
</html>

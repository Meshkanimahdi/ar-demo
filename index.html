<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Demo</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #f0eeff;
    --muted: #8887a0;
    --border: rgba(108, 99, 255, 0.2);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }

  .header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: .75rem auto 0;
    border-radius: 2px;
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: .05em;
  }

  .header p {
    font-size: .78rem;
    color: var(--muted);
    margin-top: .3rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 1.5rem 1rem;
    max-width: 480px;
    margin: 0 auto;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: transform .15s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
  }

  .btn:active {
    transform: scale(0.97);
    border-color: var(--accent);
  }

  .btn .icon {
    font-size: 2rem;
    flex-shrink: 0;
  }

  .btn .label {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    display: block;
  }

  .btn .badge {
    display: inline-block;
    margin-top: .3rem;
    font-size: .65rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(108, 99, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(108, 99, 255, 0.3);
  }

  .btn.audio .badge {
    background: rgba(255, 101, 132, 0.12);
    color: var(--accent2);
    border-color: rgba(255, 101, 132, 0.3);
  }

  .hint {
    text-align: center;
    font-size: .72rem;
    color: var(--muted);
    padding: 0 1rem 2rem;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
  }

  .modal.active {
    display: block;
  }

  #mindar-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .modal-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(1rem, env(safe-area-inset-top)) 1.25rem 1rem;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events: none;
  }

  .modal-bar button {
    pointer-events: all;
  }

  .modal-title {
    font-size: .95rem;
    font-weight: 600;
    color: #fff;
  }

  .close-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  #debug {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(0,0,0,0.75);
    color: #4ade80;
    font-size: 12px;
    font-family: monospace;
    padding: 8px 12px;
    line-height: 1.6;
    pointer-events: none;
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
  }

  .scan-overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-box {
    width: 220px;
    height: 220px;
    position: relative;
  }

  .scan-box::before,
  .scan-box::after,
  .scan-box .bl,
  .scan-box .br {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    border-color: var(--accent);
    border-style: solid;
  }

  .scan-box::before {
    top: 0;
    left: 0;
    border-width: 3px 0 0 3px;
    border-radius: 5px 0 0 0;
  }

  .scan-box::after {
    top: 0;
    right: 0;
    border-width: 3px 3px 0 0;
    border-radius: 0 5px 0 0;
  }

  .scan-box .bl {
    bottom: 0;
    left: 0;
    border-width: 0 0 3px 3px;
    border-radius: 0 0 0 5px;
  }

  .scan-box .br {
    bottom: 0;
    right: 0;
    border-width: 0 3px 3px 0;
    border-radius: 0 0 5px 0;
  }

  .scan-line {
    position: absolute;
    left: 8px;
    right: 8px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    animation: scanAnim 2s ease-in-out infinite;
    top: 20px;
  }

  @keyframes scanAnim {
    0%, 100% {
      top: 18px;
      opacity: .5;
    }

    50% {
      top: calc(100% - 20px);
      opacity: 1;
    }
  }

  .scan-label {
    margin-top: 1rem;
    font-size: .8rem;
    color: rgba(255,255,255,.8);
    letter-spacing: .05em;
    text-align: center;
  }

  .ar-control-panel {
    position: absolute;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    z-index: 998;
    display: none;
    gap: 10px;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  .ar-control-panel.active {
    display: flex;
  }

  .ar-small-btn {
    background: rgba(19,19,26,0.82);
    border: 1px solid rgba(108,99,255,0.35);
    color: #fff;
    border-radius: 999px;
    padding: .75rem 1.05rem;
    font-size: .85rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    -webkit-tap-highlight-color: transparent;
  }

  .ar-small-btn:active {
    transform: scale(.96);
  }

  .pulse {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-left: 5px;
    animation: pulseAnim 1.4s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulseAnim {
    0%, 100% {
      opacity: .3;
      transform: scale(.8);
    }

    50% {
      opacity: 1;
      transform: scale(1.2);
    }
  }
</style>
</head>

<body>

<div class="header">
  <h1>AR Scanner</h1>
  <p>Real Augmented Reality Video Overlay</p>
</div>

<div class="grid">

  <button class="btn audio" data-sample="0">
    <span class="icon">🎵</span>
    <div>
      <span class="label">Sample 1</span>
      <span class="badge">Audio AR Card</span>
    </div>
  </button>

  <button class="btn" data-sample="1">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 2</span>
      <span class="badge">Video AR</span>
    </div>
  </button>

  <button class="btn" data-sample="2">
    <span class="icon">🎬</span>
    <div>
      <span class="label">Sample 3</span>
      <span class="badge">Video AR</span>
    </div>
  </button>

</div>

<p class="hint">
  هر دکمه دوربین را فعال می‌کند.<br>
  تصویر مربوطه را جلوی دوربین بگیرید تا محتوا دقیقاً روی خود تصویر ظاهر شود.
</p>

<div class="modal" id="modal">

  <div id="mindar-container"></div>

  <div class="modal-bar">
    <span class="modal-title" id="modal-title">Sample <span class="pulse"></span></span>
    <button class="close-btn" id="closeBtn" type="button">✕</button>
  </div>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-box">
      <div class="bl"></div>
      <div class="br"></div>
      <div class="scan-line"></div>
    </div>

    <div class="scan-label" id="scanLabel">در حال بارگذاری...</div>
  </div>

  <div class="ar-control-panel" id="arControlPanel">
    <button class="ar-small-btn" id="soundBtn" type="button">🔊 صدا</button>
    <button class="ar-small-btn" id="rescanBtn" type="button">🔄 اسکن مجدد</button>
  </div>

  <div id="debug">در حال آماده‌سازی...</div>

</div>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap-shim">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module-shim">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const SAMPLES = [
  {
    label: "Sample 1 — Audio",
    type: "audio",
    mindFile: "./A01.mind",
    mediaUrl: "./A01.mp3"
  },
  {
    label: "Sample 2 — Video",
    type: "video",
    mindFile: "./A02.mind",
    mediaUrl: "./A02.mp4"
  },
  {
    label: "Sample 3 — Video",
    type: "video",
    mindFile: "./A03.mind",
    mediaUrl: "./A03.mp4"
  }
];

let mindarInstance = null;
let currentSample = null;
let currentAnchor = null;
let currentMediaElement = null;
let currentVideoTexture = null;
let currentARMesh = null;
let isStarting = false;
let targetIsVisible = false;

function log(message) {
  const debugBox = document.getElementById("debug");

  if (debugBox) {
    debugBox.textContent = message;
  }

  console.log(message);
}

function clearARContent() {
  targetIsVisible = false;

  if (currentAnchor && currentARMesh) {
    try {
      currentAnchor.group.remove(currentARMesh);
    } catch (error) {}
  }

  if (currentVideoTexture) {
    try {
      currentVideoTexture.dispose();
    } catch (error) {}
  }

  if (currentMediaElement) {
    try {
      currentMediaElement.pause();
      currentMediaElement.removeAttribute("src");
      currentMediaElement.load();
    } catch (error) {}
  }

  currentAnchor = null;
  currentARMesh = null;
  currentVideoTexture = null;
  currentMediaElement = null;

  const arControlPanel = document.getElementById("arControlPanel");
  if (arControlPanel) {
    arControlPanel.classList.remove("active");
  }
}

async function stopARInstance() {
  clearARContent();

  if (!mindarInstance) return;

  try {
    if (mindarInstance.renderer) {
      mindarInstance.renderer.setAnimationLoop(null);
    }
  } catch (error) {
    console.warn("Renderer stop warning:", error);
  }

  try {
    await mindarInstance.stop();
  } catch (error) {
    console.warn("MindAR stop warning:", error);
  }

  mindarInstance = null;
}

function createAudioCardTexture(textLine1, textLine2) {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 640;

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, "#6c63ff");
  gradient.addColorStop(1, "#ff6584");

  ctx.fillStyle = "rgba(10,10,15,0.88)";
  roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 48);
  ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 5;
  roundRect(ctx, 40, 40, canvas.width - 80, canvas.height - 80, 48);
  ctx.stroke();

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 210, 86, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 92px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("♪", canvas.width / 2, 210);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 54px Arial";
  ctx.fillText(textLine1, canvas.width / 2, 380);

  ctx.fillStyle = "rgba(255,255,255,0.72)";
  ctx.font = "34px Arial";
  ctx.fillText(textLine2, canvas.width / 2, 445);

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  return texture;
}

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function createAudioARMesh() {
  const texture = createAudioCardTexture("Audio Experience", "Tap sound if needed");

  const geometry = new THREE.PlaneGeometry(1, 0.62);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0, 0.02);

  currentVideoTexture = texture;
  currentARMesh = mesh;

  return mesh;
}

function createVideoARMesh(videoElement) {
  const texture = new THREE.VideoTexture(videoElement);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;

  currentVideoTexture = texture;

  const videoAspect = videoElement.videoWidth && videoElement.videoHeight
    ? videoElement.videoWidth / videoElement.videoHeight
    : 16 / 9;

  let width = 1.0;
  let height = width / videoAspect;

  if (height > 1.0) {
    height = 1.0;
    width = height * videoAspect;
  }

  const geometry = new THREE.PlaneGeometry(width, height);
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: false,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(0, 0, 0.02);

  currentARMesh = mesh;

  return mesh;
}

function createVideoElement(src) {
  const video = document.createElement("video");

  video.src = src;
  video.crossOrigin = "anonymous";
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.preload = "auto";

  currentMediaElement = video;

  return video;
}

function createAudioElement(src) {
  const audio = document.createElement("audio");

  audio.src = src;
  audio.loop = true;
  audio.preload = "auto";

  currentMediaElement = audio;

  return audio;
}

async function startAR(index) {
  if (isStarting) return;

  isStarting = true;
  currentSample = SAMPLES[index];

  const modal = document.getElementById("modal");
  const mindarContainer = document.getElementById("mindar-container");
  const scanOverlay = document.getElementById("scanOverlay");
  const scanLabel = document.getElementById("scanLabel");
  const modalTitle = document.getElementById("modal-title");
  const arControlPanel = document.getElementById("arControlPanel");

  modal.classList.add("active");
  modalTitle.innerHTML = `Sample ${index + 1} <span class="pulse"></span>`;

  scanOverlay.style.display = "flex";
  scanLabel.textContent = "در حال بارگذاری...";
  arControlPanel.classList.remove("active");

  mindarContainer.innerHTML = "";

  try {
    log("Stopping previous AR instance...");
    await stopARInstance();

    log("Loading target file:\n" + currentSample.mindFile);

    mindarInstance = new MindARThree({
      container: mindarContainer,
      imageTargetSrc: currentSample.mindFile,
      maxTrack: 1,
      uiLoading: "no",
      uiScanning: "no",
      uiError: "no",
      filterMinCF: 0.001,
      filterBeta: 0.01,
      missTolerance: 5,
      warmupTolerance: 3
    });

    const { renderer, scene, camera } = mindarInstance;

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const anchor = mindarInstance.addAnchor(0);
    currentAnchor = anchor;

    if (currentSample.type === "video") {
      const video = createVideoElement(currentSample.mediaUrl);

      video.addEventListener("loadedmetadata", () => {
        if (!currentAnchor || currentARMesh) return;

        const mesh = createVideoARMesh(video);
        currentAnchor.group.add(mesh);

        log("✅ Video texture prepared. Show target image.");
      });

      video.addEventListener("error", () => {
        log("❌ Video error. Check MP4 codec: H.264 video + AAC audio.");
      });

      video.load();

    } else {
      const audio = createAudioElement(currentSample.mediaUrl);
      const audioMesh = createAudioARMesh();

      anchor.group.add(audioMesh);

      audio.addEventListener("error", () => {
        log("❌ Audio error. Check MP3 path and format.");
      });

      audio.load();
    }

    anchor.onTargetFound = async () => {
      targetIsVisible = true;

      scanOverlay.style.display = "none";
      arControlPanel.classList.add("active");

      log("✅ Target found. AR content locked on image.");

      try {
        if (currentMediaElement) {
          if (currentSample.type === "video") {
            currentMediaElement.muted = true;
            await currentMediaElement.play();
            log("▶ AR video playing on image. Tap sound button for audio.");
          } else {
            await currentMediaElement.play();
            log("▶ AR audio playing. Audio card locked on image.");
          }
        }
      } catch (error) {
        log("⚠️ Autoplay blocked. Tap 🔊 sound button.");
      }
    };

    anchor.onTargetLost = () => {
      targetIsVisible = false;

      log("Target lost. AR content paused.");

      if (currentMediaElement) {
        try {
          currentMediaElement.pause();
        } catch (error) {}
      }
    };

    log("Starting camera...");

    await mindarInstance.start();

    log("✅ Camera is active. Show the target image.");
    scanLabel.textContent = "تصویر را جلوی دوربین بگیرید";

    renderer.setAnimationLoop(() => {
      if (currentARMesh && currentSample && currentSample.type === "audio" && targetIsVisible) {
        currentARMesh.rotation.z = Math.sin(Date.now() * 0.002) * 0.035;
        const scale = 1 + Math.sin(Date.now() * 0.004) * 0.025;
        currentARMesh.scale.set(scale, scale, scale);
      }

      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);

    const errorMessage = error && error.message ? error.message : String(error);

    log("❌ Error:\n" + errorMessage);
    scanLabel.textContent = "خطا در راه‌اندازی AR";
  } finally {
    isStarting = false;
  }
}

async function enableSound() {
  if (!currentMediaElement || !currentSample) {
    log("No media is ready.");
    return;
  }

  try {
    if (currentSample.type === "video") {
      currentMediaElement.muted = false;
      await currentMediaElement.play();
      log("🔊 Video sound enabled.");
    } else {
      await currentMediaElement.play();
      log("🔊 Audio enabled.");
    }
  } catch (error) {
    const errorMessage = error && error.message ? error.message : String(error);
    log("❌ Sound play error:\n" + errorMessage);
  }
}

function rescan() {
  const scanOverlay = document.getElementById("scanOverlay");
  const scanLabel = document.getElementById("scanLabel");

  if (currentMediaElement) {
    try {
      currentMediaElement.pause();
      currentMediaElement.currentTime = 0;
    } catch (error) {}
  }

  scanOverlay.style.display = "flex";
  scanLabel.textContent = "تصویر را جلوی دوربین بگیرید";

  log("✅ Camera is active. Show the target image.");
}

async function closeAR() {
  await stopARInstance();

  document.getElementById("modal").classList.remove("active");
  document.getElementById("scanOverlay").style.display = "flex";
  document.getElementById("mindar-container").innerHTML = "";
  document.getElementById("arControlPanel").classList.remove("active");

  log("AR closed");
}

function bindButtons() {
  const sampleButtons = document.querySelectorAll("[data-sample]");
  const closeBtn = document.getElementById("closeBtn");
  const rescanBtn = document.getElementById("rescanBtn");
  const soundBtn = document.getElementById("soundBtn");

  sampleButtons.forEach(button => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.sample);
      startAR(index);
    });
  });

  if (closeBtn) {
    closeBtn.addEventListener("click", closeAR);
  }

  if (rescanBtn) {
    rescanBtn.addEventListener("click", rescan);
  }

  if (soundBtn) {
    soundBtn.addEventListener("click", enableSound);
  }

  log("✅ App loaded. Buttons are ready.");
}

bindButtons();

window.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeAR();
  }
});
</script>

</body>
</html>
